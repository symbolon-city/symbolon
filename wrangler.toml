name = "registro-prova"
main = "worker/worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "registro-prova"
database_id = "d469249f-68b5-4099-be8e-503848e0b17d"

[triggers]
crons = ["17 3 * * *", "41 * * * *"]

# Anti-spam: at most 20 writes per minute per client (free Workers rate limiting).
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
DAILY_WRITE_CAP = "5000"
