name = "piazza-prova"
main = "worker/piazza-worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "piazza-prova"
database_id = "cbcd7095-7c9f-482d-9fab-19561513b4a5"

# Anti-spam: at most 30 signed envelopes per minute per client.
[[ratelimits]]
name = "ENVELOPE_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Direct link to the public register worker.
[[services]]
binding = "REGISTER"
service = "registro-prova"

# Every 6 hours: upkeep (failed seals retried, old sealed forms, nonces, per-client counters and Guide answers
# deleted: maintainPiazza in src/piazza/app.ts), then the demonstration agents check the board (src/piazza/demo.ts).
# Secrets (wrangler secret put): INTERNAL_WRITE_SECRET (same value as the register's: reserved lane for the piazza's
# seals), CLIENT_HASH_SECRET (key of the visitors' daily fingerprint; without it each isolate uses a random one and
# the visitors' daily quotas restart with every new isolate), GUIDE_ANTHROPIC_API_KEY, DEMO_OWNER_SECRET.
[triggers]
crons = ["23 */6 * * *"]

[vars]
REGISTER_URL = "https://registro-prova.symbolon-city.workers.dev"
PIAZZA_URL = "https://piazza-prova.symbolon-city.workers.dev"
DEMO_PARTNER_DOMAIN = "demo.symboloncity.com"
DEMO_OWNER_KEY = "ed25519:7245ccf0703e5d42686674b70820ae6aaf51aebf9d2ff7a38d7a2a4493c72ead"
